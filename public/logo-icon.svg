<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background & Outer Rings -->
    <linearGradient id="em-ring-grad" x1="50" y1="50" x2="462" y2="462" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Metallic E Gradient -->
    <linearGradient id="em-e-grad" x1="120" y1="180" x2="250" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#93C5FD"/>
      <stop offset="80%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Metallic M Gradient -->
    <linearGradient id="em-m-grad" x1="220" y1="260" x2="350" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Brain Network Gradient -->
    <linearGradient id="em-brain-grad" x1="180" y1="100" x2="340" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="em-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glowing Crescent Ring -->
  <circle cx="256" cy="256" r="216" stroke="url(#em-ring-grad)" stroke-width="14" stroke-linecap="round" opacity="0.9" filter="url(#em-glow)"/>
  <circle cx="256" cy="256" r="216" stroke="url(#em-ring-grad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Inner Subtle Ambient Arc -->
  <path d="M 140 140 A 170 170 0 0 1 390 190" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Human Profile Silhouette & Enclosure -->
  <path d="M 285 102 C 345 102 388 142 388 200 C 388 238 376 256 364 266 C 354 274 354 286 362 296 C 368 304 366 314 356 318 C 344 322 334 328 326 338 L 305 320" 
        stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  <!-- AI Brain Synaptic Neural Network -->
  <g stroke="url(#em-brain-grad)" stroke-width="2.5" opacity="0.95">
    <!-- Neural Vector Lines -->
    <line x1="220" y1="130" x2="250" y2="115"/>
    <line x1="250" y1="115" x2="285" y2="125"/>
    <line x1="285" y1="125" x2="315" y2="150"/>
    <line x1="315" y1="150" x2="325" y2="185"/>
    <line x1="325" y1="185" x2="295" y2="215"/>
    <line x1="295" y1="215" x2="260" y2="225"/>
    <line x1="260" y1="225" x2="225" y2="210"/>
    <line x1="225" y1="210" x2="205" y2="175"/>
    <line x1="205" y1="175" x2="220" y2="130"/>

    <!-- Internal Neural Interconnects -->
    <line x1="250" y1="115" x2="265" y2="155"/>
    <line x1="265" y1="155" x2="285" y2="125"/>
    <line x1="265" y1="155" x2="305" y2="175"/>
    <line x1="305" y1="175" x2="315" y2="150"/>
    <line x1="305" y1="175" x2="295" y2="215"/>
    <line x1="265" y1="155" x2="250" y2="190"/>
    <line x1="250" y1="190" x2="260" y2="225"/>
    <line x1="250" y1="190" x2="225" y2="210"/>
    <line x1="250" y1="190" x2="235" y2="160"/>
    <line x1="235" y1="160" x2="220" y2="130"/>
    <line x1="235" y1="160" x2="205" y2="175"/>
    <line x1="235" y1="160" x2="265" y2="155"/>

    <!-- Neural Nodes -->
    <circle cx="220" cy="130" r="4.5" fill="#67E8F9"/>
    <circle cx="250" cy="115" r="5" fill="#38BDF8"/>
    <circle cx="285" cy="125" r="5" fill="#60A5FA"/>
    <circle cx="315" cy="150" r="4.5" fill="#93C5FD"/>
    <circle cx="325" cy="185" r="5" fill="#A855F7"/>
    <circle cx="295" cy="215" r="4.5" fill="#C084FC"/>
    <circle cx="260" cy="225" r="4.5" fill="#60A5FA"/>
    <circle cx="225" cy="210" r="4" fill="#38BDF8"/>
    <circle cx="205" cy="175" r="4.5" fill="#67E8F9"/>
    <circle cx="265" cy="155" r="6" fill="#FFFFFF" filter="url(#em-glow)"/>
    <circle cx="305" cy="175" r="5" fill="#E879F9"/>
    <circle cx="250" cy="190" r="5" fill="#818CF8"/>
    <circle cx="235" cy="160" r="4.5" fill="#38BDF8"/>
  </g>

  <!-- Futuristic "E" Monogram -->
  <path d="M 130 195 L 245 195 L 225 225 L 155 225 L 155 240 L 220 240 L 205 268 L 155 268 L 155 285 L 235 285 L 220 315 L 130 315 Z"
        fill="url(#em-e-grad)" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" filter="url(#em-glow)"/>
  <path d="M 130 195 L 245 195 L 225 225 L 155 225 L 155 240 L 220 240 L 205 268 L 155 268 L 155 285 L 235 285 L 220 315 L 130 315 Z"
        fill="url(#em-e-grad)"/>

  <!-- Futuristic "M" Monogram -->
  <path d="M 230 250 L 275 350 L 320 250 L 365 375 L 330 375 L 305 295 L 275 365 L 245 295 L 220 375 L 185 375 Z"
        fill="url(#em-m-grad)" stroke="#2E1065" stroke-width="3" stroke-linejoin="round" filter="url(#em-glow)"/>
  <path d="M 230 250 L 275 350 L 320 250 L 365 375 L 330 375 L 305 295 L 275 365 L 245 295 L 220 375 L 185 375 Z"
        fill="url(#em-m-grad)"/>
</svg>
