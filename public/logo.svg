  <g transform="translate(10, 10) scale(0.234)">
    <circle cx="256" cy="256" r="220" stroke="url(#logo-ring)" stroke-width="20"/>
    <path d="M 285 102 C 345 102 388 142 388 200 C 388 238 376 256 364 266 C 354 274 354 286 362 296 C 368 304 366 314 356 318 C 344 322 334 328 326 338 L 305 320" 
          stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g stroke="url(#logo-brain)" stroke-width="3.5">
      <line x1="220" y1="130" x2="250" y2="115"/><line x1="250" y1="115" x2="285" y2="125"/><line x1="285" y1="125" x2="315" y2="150"/>
      <line x1="315" y1="150" x2="325" y2="185"/><line x1="325" y1="185" x2="295" y2="215"/><line x1="295" y1="215" x2="260" y2="225"/>
      <line x1="260" y1="225" x2="225" y2="210"/><line x1="225" y1="210" x2="205" y2="175"/><line x1="205" y1="175" x2="220" y2="130"/>
      <line x1="250" y1="115" x2="265" y2="155"/><line x1="265" y1="155" x2="285" y2="125"/><line x1="265" y1="155" x2="305" y2="175"/>
      <line x1="305" y1="175" x2="315" y2="150"/><line x1="305" y1="175" x2="295" y2="215"/><line x1="265" y1="155" x2="250" y2="190"/>
      <line x1="250" y1="190" x2="225" y2="210"/><line x1="235" y1="160" x2="265" y2="155"/>
      <circle cx="220" cy="130" r="6" fill="#67E8F9"/><circle cx="250" cy="115" r="7" fill="#38BDF8"/><circle cx="285" cy="125" r="7" fill="#60A5FA"/>
      <circle cx="315" cy="150" r="6" fill="#C084FC"/><circle cx="325" cy="185" r="7" fill="#A855F7"/><circle cx="295" cy="215" r="6" fill="#E879F9"/>
      <circle cx="265" cy="155" r="8" fill="#FFFFFF"/><circle cx="250" cy="190" r="7" fill="#818CF8"/>
    </g>
    <path d="M 130 195 L 245 195 L 225 225 L 155 225 L 155 240 L 220 240 L 205 268 L 155 268 L 155 285 L 235 285 L 220 315 L 130 315 Z" fill="url(#logo-e)"/>
    <path d="M 230 250 L 275 350 L 320 250 L 365 375 L 330 375 L 305 295 L 275 365 L 245 295 L 220 375 L 185 375 Z" fill="url(#logo-m)"/>
  </g>

  <!-- WORDMARK: EXAMMIND -->
  <text x="155" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="2">
    <tspan fill="url(#logo-exam)">EXAM</tspan><tspan fill="url(#logo-mind)">MIND</tspan>
  </text>

  <!-- SUB-WORDMARK: — AI — -->
  <line x1="158" y1="108" x2="285" y2="108" stroke="url(#logo-mind)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <text x="325" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="6" fill="url(#logo-ai)" text-anchor="middle">AI</text>
  <line x1="365" y1="108" x2="492" y2="108" stroke="url(#logo-ring)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- TAGLINE -->
  <text x="325" y="132" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="4" fill="#94A3B8" text-anchor="middle">SMART STUDY. BETTER RESULTS.</text>
