  </defs>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="220" stroke="url(#fav-ring)" stroke-width="18"/>

  <!-- Profile Silhouette -->
  <path d="M 285 102 C 345 102 388 142 388 200 C 388 238 376 256 364 266 C 354 274 354 286 362 296 C 368 304 366 314 356 318 C 344 322 334 328 326 338 L 305 320" 
