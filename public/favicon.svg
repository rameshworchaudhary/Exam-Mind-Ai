    <linearGradient id="fav-brain" x1="180" y1="100" x2="340" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
